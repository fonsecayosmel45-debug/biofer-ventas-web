spring.application.name=biofer-ventas
server.port=${PORT:8080}
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:biofer_ventas_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:biofer_app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.web.pageable.max-page-size=200
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
biofer.jwt-secret=${BIOFER_JWT_SECRET}
biofer.admin-user=${BIOFER_ADMIN_USER:admin}
biofer.admin-password=${BIOFER_ADMIN_PASSWORD}
biofer.cors-origins=${BIOFER_CORS_ORIGINS:http://localhost:4200}
biofer.archivos=${BIOFER_ARCHIVOS:.local/archivos}
server.error.include-message=never

spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
