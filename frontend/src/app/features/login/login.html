<div class="login-page">
  <header class="brand">
    <img src="/images/logo.svg" alt="" width="42" height="42" />
    <span>BIOFER<small>Productos agrícolas</small></span>
  </header>
  <main>
    <section class="wrapper" aria-labelledby="login-title">
      <img class="logo" src="/images/logo.svg" alt="Símbolo de BIOFER" width="64" height="64" />
      <p class="eyebrow">BIENVENIDO A BIOFER</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="intro">Todo lo que cultivas, en un solo lugar.</p>
      <form (ngSubmit)="enter()" #form="ngForm">
        <div class="input-field">
          <input id="username" name="usuario" [(ngModel)]="usuario" required autocomplete="username" placeholder=" " maxlength="100" [disabled]="busy()" />
          <label for="username">Nombre de usuario</label>
        </div>
        <div class="input-field password-field">
          <input id="password" name="clave" [(ngModel)]="clave" [type]="visible ? 'text' : 'password'" required autocomplete="current-password" placeholder=" " [disabled]="busy()" />
          <label for="password">Contraseña</label>
          <button class="reveal" type="button" [attr.aria-label]="visible ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="visible" aria-controls="password" (click)="visible = !visible"><app-icon [name]="visible ? 'eyeOff' : 'eye'" /></button>
        </div>
        <div class="forget">
          <label class="remember"><input type="checkbox" name="remember" [(ngModel)]="remember" (ngModelChange)="rememberUser()" />Recordar usuario</label>
          <span class="access-label">Administración</span>
        </div>
        <button class="submit" type="submit" [disabled]="form.invalid || busy()">{{ busy() ? 'Ingresando…' : 'Ingresar' }}<span aria-hidden="true">→</span></button>
        @if (error()) { <p class="message" role="alert">{{ error() }}</p> }
        <p class="register">Sistema de ventas e inventario</p>
      </form>
      <div class="card-footer"><span aria-hidden="true">◦</span> Crecemos contigo.</div>
    </section>
  </main>
  <footer><span>BIOFER · Cultivando un mejor futuro</span><span>GESTIÓN DE VENTAS</span></footer>
</div>
